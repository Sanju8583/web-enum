<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title|default("CorpTools Internal Portal") }}</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 32px; color: #222; background: #f5f5f5; }
    header { border-bottom: 1px solid #aaa; margin-bottom: 22px; padding-bottom: 10px; }
    nav a { margin-right: 16px; color: #0645ad; }
    main { max-width: 900px; background: #fff; border: 1px solid #bbb; padding: 22px; }
    h1 { font-size: 24px; margin: 0 0 12px; }
    h2 { font-size: 18px; margin-top: 24px; }
    table { border-collapse: collapse; width: 100%; margin-top: 12px; }
    th, td { border: 1px solid #bbb; padding: 7px; text-align: left; }
    th { background: #e8e8e8; }
    pre { background: #eee; border: 1px solid #ccc; padding: 12px; overflow-x: auto; }
    .notice { background: #ffffe0; border: 1px solid #d6d68c; padding: 10px; }
    .error { color: #9b111e; }
    .flag { border: 2px solid #222; background: #e8ffe8; padding: 18px; font-size: 22px; font-family: Consolas, monospace; }
    label { display: block; margin-top: 10px; }
    input { display: block; padding: 6px; width: 260px; margin-top: 4px; }
    button { margin-top: 14px; padding: 7px 14px; }
  </style>
</head>
<body>
  <header>
    <strong>CorpTools Internal Portal</strong>
    <nav>
      <a href="/">Home</a>
      <a href="/about">About</a>
      <a href="/contact">Contact</a>
      <a href="/services">Services</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
